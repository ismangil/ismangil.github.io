<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#16213e"/>
  <g transform="translate(256,256)">
    <!-- Rail tracks forming an L shape -->
    <g stroke="#e8e8e8" stroke-width="8" fill="none" stroke-linecap="round">
      <!-- Horizontal straight -->
      <line x1="-160" y1="0" x2="80" y2="0"/>
      <line x1="-160" y1="20" x2="80" y2="20"/>
      <!-- Ties -->
      <line x1="-140" y1="-4" x2="-140" y2="24" stroke-width="5"/>
      <line x1="-110" y1="-4" x2="-110" y2="24" stroke-width="5"/>
      <line x1="-80" y1="-4" x2="-80" y2="24" stroke-width="5"/>
      <line x1="-50" y1="-4" x2="-50" y2="24" stroke-width="5"/>
      <line x1="-20" y1="-4" x2="-20" y2="24" stroke-width="5"/>
      <line x1="10" y1="-4" x2="10" y2="24" stroke-width="5"/>
      <line x1="40" y1="-4" x2="40" y2="24" stroke-width="5"/>
      <line x1="70" y1="-4" x2="70" y2="24" stroke-width="5"/>
      <!-- Curve going up -->
      <path d="M 80,0 A 120,120 0 0,0 200,-120" />
      <path d="M 80,20 A 100,100 0 0,0 180,-120" />
    </g>
    <!-- Connection points -->
    <circle cx="-160" cy="10" r="10" fill="#4ecca3"/>
    <circle cx="190" cy="-120" r="10" fill="#4ecca3"/>
  </g>
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#4ecca3">RAIL</text>
</svg>
